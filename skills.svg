<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300">
  <defs>
    <filter id="bGlow" x="-3%" y="-200%" width="106%" height="500%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="tGlow" x="-8%" y="-60%" width="116%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="300" rx="10" fill="#080d14"/>
  <rect x="0.75" y="0.75" width="898.5" height="298.5" rx="9.5" fill="none" stroke="#1a2438" stroke-width="1.5"/>

  <!-- Section title -->
  <text x="450" y="34" text-anchor="middle" font-family="'Courier New',monospace" font-size="13"
        font-weight="bold" fill="#60A5FA" letter-spacing="6" filter="url(#tGlow)">SKILL MATRIX</text>
  <line x1="60" y1="44" x2="840" y2="44" stroke="#1a2438" stroke-width="1"/>

  <!-- Vertical divider -->
  <line x1="450" y1="50" x2="450" y2="288" stroke="#1a2438" stroke-width="1"/>

  <!-- ════ LEFT ════  Label x=20 | Bar x1=168 x2=432 | Pct x=440 -->

  <!-- Python 95% — bar fills to 238px of 264px -->
  <text x="20" y="90" font-family="'Courier New',monospace" font-size="11" fill="#94A3B8">Python</text>
  <rect x="168" y="80" width="264" height="9" rx="4.5" fill="#1a2438"/>
  <rect x="168" y="80" width="0" height="9" rx="4.5" fill="#60A5FA" filter="url(#bGlow)">
    <animate attributeName="width" values="0;251;251;0" keyTimes="0;0.32;0.84;1" dur="5s" repeatCount="indefinite" begin="0s"
             calcMode="spline" keySplines="0.4 0 0.2 1;0;0;0.4 0 0.2 1"/>
  </rect>
  <text x="440" y="90" font-family="'Courier New',monospace" font-size="9.5" fill="#60A5FA" opacity="0">
    <animate attributeName="opacity" values="0;0;0.85;0.85;0" keyTimes="0;0.3;0.34;0.84;0.88" dur="5s" repeatCount="indefinite" begin="0s"/>
    95%
  </text>

  <!-- FastAPI 90% -->
  <text x="20" y="136" font-family="'Courier New',monospace" font-size="11" fill="#94A3B8">FastAPI</text>
  <rect x="168" y="126" width="264" height="9" rx="4.5" fill="#1a2438"/>
  <rect x="168" y="126" width="0" height="9" rx="4.5" fill="#A78BFA" filter="url(#bGlow)">
