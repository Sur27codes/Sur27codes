<svg xmlns="http://www.w3.org/2000/svg" width="900" height="54" viewBox="0 0 900 54">
  <defs>
    <clipPath id="card"><rect width="900" height="54" rx="10"/></clipPath>
  </defs>

  <!-- background -->
  <rect width="900" height="54" rx="10" fill="#0d1117"/>

  <!-- scanline beam -->
  <rect clip-path="url(#card)" x="-220" y="0" width="220" height="54" fill="#ffffff" fill-opacity="0.04">
    <animate attributeName="x" from="-220" to="900" dur="3s" repeatCount="indefinite" calcMode="ease-in-out"/>
  </rect>

  <!-- outer border -->
  <rect x="0.5" y="0.5" width="899" height="53" rx="9.5" fill="none" stroke="#ffffff" stroke-width="1">
    <animate attributeName="stroke-opacity" values="0.12;0.28;0.12" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- TECH STACK label -->
  <line x1="128" y1="10" x2="128" y2="44" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1"/>
  <text x="16" y="28" font-family="'Courier New',Courier,monospace" font-size="9.5" font-weight="bold"
        fill="#ffffff" fill-opacity="0.7" letter-spacing="3" dominant-baseline="central">TECH STACK</text>

  <!-- ── TAB 1: LANGUAGES (blue #60A5FA) ── -->
  <!-- base pill always visible -->
  <rect x="140" y="14" width="92" height="26" rx="13"
        fill="#60A5FA" fill-opacity="0.12" stroke="#60A5FA" stroke-opacity="0.6" stroke-width="1.2"/>
  <!-- always-on label -->
  <text x="186" y="28" font-family="'Courier New',Courier,monospace" font-size="9" font-weight="bold"
        fill="#60A5FA" fill-opacity="1" text-anchor="middle" dominant-baseline="central" letter-spacing="1">LANGUAGES</text>
  <!-- pulse glow overlay -->
  <rect x="136" y="10" width="100" height="34" rx="15"
        fill="#60A5FA" fill-opacity="0" stroke="#60A5FA" stroke-opacity="0" stroke-width="2">
    <animate attributeName="fill-opacity"   values="0;0;0.15;0;0;0;0;0;0;0" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="0;0;0.9;0;0;0;0;0;0;0"  dur="10s" repeatCount="indefinite"/>
  </rect>

  <!-- ── TAB 2: AI / ML (purple #A78BFA) ── -->
  <rect x="248" y="14" width="78" height="26" rx="13"
        fill="#A78BFA" fill-opacity="0.12" stroke="#A78BFA" stroke-opacity="0.6" stroke-width="1.2"/>
  <text x="287" y="28" font-family="'Courier New',Courier,monospace" font-size="9" font-weight="bold"
        fill="#A78BFA" fill-opacity="1" text-anchor="middle" dominant-baseline="central" letter-spacing="1">AI / ML</text>
  <rect x="244" y="10" width="86" height="34" rx="15"
        fill="#A78BFA" fill-opacity="0" stroke="#A78BFA" stroke-opacity="0" stroke-width="2">
    <animate attributeName="fill-opacity"   values="0;0;0;0.15;0;0;0;0;0;0" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="0;0;0;0.9;0;0;0;0;0;0"  dur="10s" repeatCount="indefinite"/>
  </rect>

  <!-- ── TAB 3: LLMs · GEN AI (indigo #818CF8) ── -->
  <rect x="342" y="14" width="124" height="26" rx="13"
        fill="#818CF8" fill-opacity="0.12" stroke="#818CF8" stroke-opacity="0.6" stroke-width="1.2"/>
  <text x="404" y="28" font-family="'Courier New',Courier,monospace" font-size="9" font-weight="bold"
        fill="#818CF8" fill-opacity="1" text-anchor="middle" dominant-baseline="central" letter-spacing="1">LLMs · GEN AI</text>
  <rect x="338" y="10" width="132" height="34" rx="15"
        fill="#818CF8" fill-opacity="0" stroke="#818CF8" stroke-opacity="0" stroke-width="2">
    <animate attributeName="fill-opacity"   values="0;0;0;0;0.15;0;0;0;0;0" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="0;0;0;0;0.9;0;0;0;0;0"  dur="10s" repeatCount="indefinite"/>
  </rect>

  <!-- ── TAB 4: BACKEND · CLOUD (pink #F472B6) ── -->
  <rect x="482" y="14" width="140" height="26" rx="13"
        fill="#F472B6" fill-opacity="0.12" stroke="#F472B6" stroke-opacity="0.6" stroke-width="1.2"/>
  <text x="552" y="28" font-family="'Courier New',Courier,monospace" font-size="9" font-weight="bold"
        fill="#F472B6" fill-opacity="1" text-anchor="middle" dominant-baseline="central" letter-spacing="1">BACKEND · CLOUD</text>
  <rect x="478" y="10" width="148" height="34" rx="15"
        fill="#F472B6" fill-opacity="0" stroke="#F472B6" stroke-opacity="0" stroke-width="2">
    <animate attributeName="fill-opacity"   values="0;0;0;0;0;0.15;0;0;0;0" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="0;0;0;0;0;0.9;0;0;0;0"  dur="10s" repeatCount="indefinite"/>
  </rect>

  <!-- ── TAB 5: FRONTEND · DATA (green #34D399) ── -->
  <rect x="638" y="14" width="140" height="26" rx="13"
        fill="#34D399" fill-opacity="0.12" stroke="#34D399" stroke-opacity="0.6" stroke-width="1.2"/>
  <text x="708" y="28" font-family="'Courier New',Courier,monospace" font-size="9" font-weight="bold"
        fill="#34D399" fill-opacity="1" text-anchor="middle" dominant-baseline="central" letter-spacing="1">FRONTEND · DATA</text>
  <rect x="634" y="10" width="148" height="34" rx="15"
        fill="#34D399" fill-opacity="0" stroke="#34D399" stroke-opacity="0" stroke-width="2">
    <animate attributeName="fill-opacity"   values="0;0;0;0;0;0;0.15;0;0;0" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="0;0;0;0;0;0;0.9;0;0;0"  dur="10s" repeatCount="indefinite"/>
  </rect>

  <!-- corner dots -->
  <circle cx="6"   cy="6"   r="2" fill="#60A5FA"><animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/></circle>
  <circle cx="894" cy="6"   r="2" fill="#34D399"><animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite" begin="0.5s"/></circle>
  <circle cx="6"   cy="48"  r="2" fill="#A78BFA"><animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite" begin="1s"/></circle>
  <circle cx="894" cy="48"  r="2" fill="#F472B6"><animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite" begin="1.5s"/></circle>
</svg>
