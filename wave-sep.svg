<svg xmlns="http://www.w3.org/2000/svg" width="900" height="28" viewBox="0 0 900 28">
  <rect width="900" height="28" fill="#080d14"/>
  <line x1="0" y1="14" x2="900" y2="14" stroke="#111e2e" stroke-width="1"/>
  <line x1="-120" y1="14" x2="-60" y2="14" stroke="#60A5FA" stroke-width="1.5" stroke-linecap="round" opacity="0.8">
    <animate attributeName="x1" values="-120;960" dur="2.1s" repeatCount="indefinite" calcMode="linear"/>
    <animate attributeName="x2" values="-60;1020" dur="2.1s" repeatCount="indefinite" calcMode="linear"/>
  </line>
  <line x1="-180" y1="14" x2="-100" y2="14" stroke="#A78BFA" stroke-width="1.5" stroke-linecap="round" opacity="0.65">
    <animate attributeName="x1" values="-180;980" dur="3.3s" begin="0.8s" repeatCount="indefinite" calcMode="linear"/>
    <animate attributeName="x2" values="-100;1060" dur="3.3s" begin="0.8s" repeatCount="indefinite" calcMode="linear"/>
  </line>
  <line x1="-80" y1="14" x2="-40" y2="14" stroke="#34D399" stroke-width="1.5" stroke-linecap="round" opacity="0.5">
    <animate attributeName="x1" values="-80;940" dur="1.7s" begin="1.4s" repeatCount="indefinite" calcMode="linear"/>
    <animate attributeName="x2" values="-40;980" dur="1.7s" begin="1.4s" repeatCount="indefinite" calcMode="linear"/>
  </line>
  <circle cy="14" r="3" fill="#60A5FA" opacity="0.9">
    <animate attributeName="cx" values="-60;960" dur="2.1s" repeatCount="indefinite" calcMode="linear"/>
  </circle>
  <circle cy="14" r="2" fill="#A78BFA" opacity="0.7">
    <animate attributeName="cx" values="-100;1000" dur="3.3s" begin="0.8s" repeatCount="indefinite" calcMode="linear"/>
  </circle>
</svg>