<svg xmlns="http://www.w3.org/2000/svg" width="900" height="40" viewBox="0 0 900 40">
  <defs>
    <filter id="g1" x="-5%" y="-200%" width="110%" height="500%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="fx" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.08" stop-color="#fff" stop-opacity="1"/>
      <stop offset="0.92" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1"    stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="mx"><rect width="900" height="40" fill="url(#fx)"/></mask>
  </defs>

  <rect width="900" height="40" fill="#080d14"/>

  <g mask="url(#mx)">
    <!-- Static base line -->
    <line x1="0" y1="20" x2="900" y2="20" stroke="#1a2438" stroke-width="1"/>

    <!-- Blue pulse -->
    <line x1="0" y1="20" x2="900" y2="20" stroke="#60A5FA" stroke-width="2.5"
          filter="url(#g1)" stroke-dasharray="120 900" stroke-linecap="round">
      <animate attributeName="stroke-dashoffset" from="1020" to="-1020" dur="3s" repeatCount="indefinite"/>
    </line>

    <!-- Purple pulse offset -->
    <line x1="0" y1="20" x2="900" y2="20" stroke="#A78BFA" stroke-width="2"
          filter="url(#g1)" stroke-dasharray="80 940" stroke-linecap="round">
      <animate attributeName="stroke-dashoffset" from="1020" to="-1020" dur="4.2s" repeatCount="indefinite" begin="1.6s"/>
    </line>
  </g>
</svg>
