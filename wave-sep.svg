<svg xmlns="http://www.w3.org/2000/svg" width="900" height="50" viewBox="0 0 900 50">
  <defs>
    <filter id="gw" x="-5%" y="-150%" width="110%" height="400%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="fx" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.08" stop-color="#fff" stop-opacity="1"/>
      <stop offset="0.92" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1"    stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="mx"><rect width="900" height="50" fill="url(#fx)"/></mask>
  </defs>

  <rect width="900" height="50" fill="#0d1117"/>

  <g mask="url(#mx)">
    <!-- dim static base wave -->
    <path d="M 0,25 C 50,10 100,40 150,25 C 200,10 250,40 300,25 C 350,10 400,40 450,25 C 500,10 550,40 600,25 C 650,10 700,40 750,25 C 800,10 850,40 900,25"
          stroke="#7B9EFF" stroke-width="1.2" fill="none" opacity="0.18"/>

    <!-- blue pulse -->
    <path d="M 0,25 C 50,10 100,40 150,25 C 200,10 250,40 300,25 C 350,10 400,40 450,25 C 500,10 550,40 600,25 C 650,10 700,40 750,25 C 800,10 850,40 900,25"
          stroke="#7B9EFF" stroke-width="3" fill="none" filter="url(#gw)" stroke-dasharray="130 940">
      <animate attributeName="stroke-dashoffset" from="1070" to="-1070" dur="3s" repeatCount="indefinite"/>
    </path>

    <!-- purple pulse (offset timing) -->
    <path d="M 0,25 C 50,10 100,40 150,25 C 200,10 250,40 300,25 C 350,10 400,40 450,25 C 500,10 550,40 600,25 C 650,10 700,40 750,25 C 800,10 850,40 900,25"
          stroke="#a259ff" stroke-width="2.2" fill="none" filter="url(#gw)" stroke-dasharray="90 980">
      <animate attributeName="stroke-dashoffset" from="1070" to="-1070" dur="3.8s" repeatCount="indefinite" begin="1.8s"/>
    </path>
  </g>
</svg>
