<svg xmlns="http://www.w3.org/2000/svg" width="860" height="48" viewBox="0 0 860 48">
  <defs>
    <clipPath id="c"><rect width="860" height="48" rx="8"/></clipPath>
  </defs>

  <rect width="860" height="48" rx="8" fill="#0d1117"/>
  <rect width="860" height="48" rx="8" fill="#F472B6" fill-opacity="0.06"/>

  <rect clip-path="url(#c)" x="-180" y="0" width="180" height="48" fill="#F472B6" fill-opacity="0.09">
    <animate attributeName="x" from="-180" to="860" dur="2.4s" repeatCount="indefinite" calcMode="ease-in-out" begin="0.8s"/>
  </rect>

  <rect x="1" y="1" width="858" height="46" rx="7" fill="none" stroke="#F472B6" stroke-width="1.5">
    <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="2.2s" repeatCount="indefinite" begin="0.8s"/>
  </rect>

  <rect x="0" y="0" width="5" height="48" rx="3" fill="#F472B6">
    <animate attributeName="fill-opacity" values="0.7;1;0.7" dur="2.2s" repeatCount="indefinite" begin="0.8s"/>
  </rect>
  <rect x="855" y="0" width="5" height="48" rx="3" fill="#F472B6">
    <animate attributeName="fill-opacity" values="0.7;1;0.7" dur="2.2s" repeatCount="indefinite" begin="1.9s"/>
  </rect>

  <line x1="16" y1="24" x2="240" y2="24" stroke="#F472B6" stroke-opacity="0.25" stroke-width="1" stroke-dasharray="4 6"/>
  <line x1="620" y1="24" x2="844" y2="24" stroke="#F472B6" stroke-opacity="0.25" stroke-width="1" stroke-dasharray="4 6"/>

  <circle cy="24" r="3" fill="#F472B6">
    <animate attributeName="cx" from="16" to="240" dur="1.8s" repeatCount="indefinite" begin="0.3s"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.85;1" dur="1.8s" repeatCount="indefinite" begin="0.3s"/>
  </circle>
  <circle cy="24" r="3" fill="#F472B6">
    <animate attributeName="cx" from="844" to="620" dur="1.8s" repeatCount="indefinite" begin="1.4s"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.85;1" dur="1.8s" repeatCount="indefinite" begin="1.4s"/>
  </circle>

  <text x="430" y="25" font-family="'Courier New',Courier,monospace" font-size="13" font-weight="bold"
        fill="#F472B6" fill-opacity="0.2" text-anchor="middle" dominant-baseline="central" letter-spacing="5">
    ⟨  BACKEND · CLOUD · DEVOPS  ⟩
  </text>
  <text x="430" y="25" font-family="'Courier New',Courier,monospace" font-size="13" font-weight="bold"
        text-anchor="middle" dominant-baseline="central" letter-spacing="5">
    <animate attributeName="fill" values="#F472B6;#F9A8D4;#F472B6" dur="2.2s" repeatCount="indefinite" begin="0.8s"/>
    <animate attributeName="fill-opacity" values="1;0.7;1" dur="2.2s" repeatCount="indefinite" begin="0.8s"/>
    ⟨  BACKEND · CLOUD · DEVOPS  ⟩
  </text>
</svg>
