<svg xmlns="http://www.w3.org/2000/svg" width="860" height="220" viewBox="0 0 860 220">
  <defs>
    <clipPath id="gs"><rect width="860" height="220" rx="10"/></clipPath>
  </defs>

  <!-- Background -->
  <rect width="860" height="220" rx="10" fill="#0d1117"/>

  <!-- Subtle scanline -->
  <rect clip-path="url(#gs)" x="-160" y="0" width="160" height="220" fill="#a78bfa" fill-opacity="0.025">
    <animate attributeName="x" from="-160" to="860" dur="8s" repeatCount="indefinite" calcMode="ease-in-out"/>
  </rect>

  <!-- Border -->
  <rect x="1" y="1" width="858" height="218" rx="9" fill="none" stroke="#30363d" stroke-width="1"/>

  <!-- Left accent stripe -->
  <rect x="0" y="0" width="3" height="220" rx="1" fill="#a78bfa" fill-opacity="0.8"/>

  <!-- ══════════════════════════════════════════════════════════ -->
  <!--  LINE 1 — command prompt                                  -->
  <!-- ══════════════════════════════════════════════════════════ -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="0.1s" fill="freeze"/>
    <text x="18" y="26" font-family="'Courier New',Courier,monospace" font-size="12">
      <tspan fill="#22d3ee">$</tspan>
      <tspan fill="#6e7681"> git status</tspan>
    </text>
  </g>

  <!-- Separator 1 -->
  <line x1="18" y1="34" x2="842" y2="34" stroke="#21262d" stroke-width="1" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.1s" begin="0.3s" fill="freeze"/>
  </line>

  <!-- ══════════════════════════════════════════════════════════ -->
  <!--  LINE 2 — branch / context                               -->
  <!-- ══════════════════════════════════════════════════════════ -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="0.4s" fill="freeze"/>
    <text x="18" y="52" font-family="'Courier New',Courier,monospace" font-size="11">
      <tspan fill="#4d5562">On branch </tspan>
      <tspan fill="#60a5fa">ms-data-science/stony-brook</tspan>
      <tspan fill="#4d5562">  ·  GPA </tspan>
      <tspan fill="#c9d1d9">3.4</tspan>
      <tspan fill="#4d5562">  ·  Expected </tspan>
      <tspan fill="#c9d1d9">May 2027</tspan>
    </text>
  </g>

  <!-- ══════════════════════════════════════════════════════════ -->
  <!--  SECTION: Changes in progress                            -->
  <!-- ══════════════════════════════════════════════════════════ -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="0.7s" fill="freeze"/>
    <text x="18" y="74" font-family="'Courier New',Courier,monospace" font-size="9" fill="#4d5562" letter-spacing="1">
      CHANGES IN PROGRESS:
    </text>
  </g>

  <!-- ── EchoMindAI ── active LED -->
  <circle cx="10" cy="87" r="3" fill="#34d399" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.1s" begin="0.85s" fill="freeze"/>
    <animate attributeName="r" values="2.5;3.5;2.5" dur="1.2s" repeatCount="indefinite" begin="0.85s"/>
    <animate attributeName="fill-opacity" values="1;0.5;1" dur="1.2s" repeatCount="indefinite" begin="0.85s"/>
  </circle>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.25s" begin="0.85s" fill="freeze"/>
    <text x="18" y="91" font-family="'Courier New',Courier,monospace" font-size="11">
      <tspan fill="#f59e0b">M</tspan>
      <tspan fill="#e6edf3">  EchoMindAI     </tspan>
      <tspan fill="#3d4450">──  </tspan>
      <tspan fill="#a78bfa">LLMs · RAG pipeline · FastAPI · React</tspan>
    </text>
    <text x="842" y="91" font-family="'Courier New',Courier,monospace" font-size="10" text-anchor="end">
      <tspan fill="#34d399">●●●</tspan><tspan fill="#6e7681">  active</tspan>
    </text>
  </g>

  <!-- ── InsightX ── research LED -->
  <circle cx="10" cy="107" r="3" fill="#fb923c" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.1s" begin="1.1s" fill="freeze"/>
    <animate attributeName="fill-opacity" values="1;0.4;1" dur="1.8s" repeatCount="indefinite" begin="1.1s"/>
  </circle>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.25s" begin="1.1s" fill="freeze"/>
    <text x="18" y="111" font-family="'Courier New',Courier,monospace" font-size="11">
      <tspan fill="#f59e0b">M</tspan>
      <tspan fill="#e6edf3">  InsightX       </tspan>
      <tspan fill="#3d4450">──  </tspan>
      <tspan fill="#a78bfa">Clinical NLP · BERT · PyTorch · AWS</tspan>
    </text>
    <text x="842" y="111" font-family="'Courier New',Courier,monospace" font-size="10" text-anchor="end">
      <tspan fill="#34d399">●●</tspan><tspan fill="#2d333b">●</tspan><tspan fill="#6e7681">  research</tspan>
    </text>
  </g>

  <!-- ── SAARTHI ── submitted (static dim green) -->
  <circle cx="10" cy="127" r="2.5" fill="#34d399" fill-opacity="0.4" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.1s" begin="1.35s" fill="freeze"/>
  </circle>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.25s" begin="1.35s" fill="freeze"/>
    <text x="18" y="131" font-family="'Courier New',Courier,monospace" font-size="11">
      <tspan fill="#34d399">✓</tspan>
      <tspan fill="#e6edf3">  SAARTHI        </tspan>
      <tspan fill="#3d4450">──  </tspan>
      <tspan fill="#a78bfa">Disaster routing · GNN · Geospatial ML</tspan>
    </text>
    <text x="842" y="131" font-family="'Courier New',Courier,monospace" font-size="10" text-anchor="end">
      <tspan fill="#34d399" fill-opacity="0.7">✓✓✓</tspan><tspan fill="#4d5562">  submitted</tspan>
    </text>
  </g>

  <!-- ══════════════════════════════════════════════════════════ -->
  <!--  SECTION: Untracked (exploring)                          -->
  <!-- ══════════════════════════════════════════════════════════ -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="1.55s" fill="freeze"/>
    <text x="18" y="152" font-family="'Courier New',Courier,monospace" font-size="9" fill="#4d5562" letter-spacing="1">
      EXPLORING:
    </text>
  </g>

  <!-- ── graph-neural-nets ── exploring LED -->
  <circle cx="10" cy="165" r="2.5" fill="#6e7681" fill-opacity="0.5" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.1s" begin="1.7s" fill="freeze"/>
  </circle>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.25s" begin="1.7s" fill="freeze"/>
    <text x="18" y="169" font-family="'Courier New',Courier,monospace" font-size="11">
      <tspan fill="#6e7681">?</tspan>
      <tspan fill="#8b949e">  graph-neural-nets  </tspan>
      <tspan fill="#3d4450">──  </tspan>
      <tspan fill="#6e7681">reading papers, prototyping in PyG</tspan>
    </text>
    <text x="842" y="169" font-family="'Courier New',Courier,monospace" font-size="10" text-anchor="end">
      <tspan fill="#34d399">●</tspan><tspan fill="#2d333b">●●</tspan><tspan fill="#4d5562">  learning</tspan>
    </text>
  </g>

  <!-- Separator 2 -->
  <line x1="18" y1="182" x2="842" y2="182" stroke="#21262d" stroke-width="1" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.1s" begin="1.9s" fill="freeze"/>
  </line>

  <!-- ══════════════════════════════════════════════════════════ -->
  <!--  FOOTER                                                  -->
  <!-- ══════════════════════════════════════════════════════════ -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="2.0s" fill="freeze"/>
    <text x="18" y="198" font-family="'Courier New',Courier,monospace" font-size="11" fill="#4d5562">
      nothing to commit, plenty to build.
    </text>
    <text x="18" y="213" font-family="'Courier New',Courier,monospace" font-size="11">
      <tspan fill="#4d5562">open for  </tspan>
      <tspan fill="#a78bfa">research collaboration</tspan>
      <tspan fill="#4d5562">  ·  </tspan>
      <tspan fill="#a78bfa">internship</tspan>
      <tspan fill="#4d5562">  ·  </tspan>
      <tspan fill="#a78bfa">full-time</tspan>
      <tspan fill="#4d5562">  (May 2027)</tspan>
    </text>
  </g>

</svg>
