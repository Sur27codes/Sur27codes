<svg xmlns="http://www.w3.org/2000/svg" width="860" height="230" viewBox="0 0 860 230">
  <defs>
    <!-- Node glow -->
    <filter id="ng" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Signal spark glow -->
    <filter id="sg" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Radial bg glow -->
    <radialGradient id="bgr" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#0e1428"/>
      <stop offset="100%" stop-color="#0a0d15"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="860" height="230" rx="10" fill="url(#bgr)"/>
  <rect x="1" y="1" width="858" height="228" rx="9" fill="none" stroke="#1e2640" stroke-width="1"/>

  <!-- Ambient center glow -->
  <ellipse cx="430" cy="115" rx="240" ry="90" fill="#6d28d9" fill-opacity="0.045"/>

  <!-- ════ CONNECTIONS — all adjacent layer pairs ════ -->
  <!-- Input(3) → Hidden1(4) : 12 lines -->
  <line x1="195" y1="75"  x2="345" y2="55"  stroke="#16213a" stroke-width="1"/>
  <line x1="195" y1="75"  x2="345" y2="95"  stroke="#16213a" stroke-width="1"/>
  <line x1="195" y1="75"  x2="345" y2="135" stroke="#16213a" stroke-width="1"/>
  <line x1="195" y1="75"  x2="345" y2="175" stroke="#16213a" stroke-width="1"/>
  <line x1="195" y1="115" x2="345" y2="55"  stroke="#16213a" stroke-width="1"/>
  <line x1="195" y1="115" x2="345" y2="95"  stroke="#16213a" stroke-width="1"/>
  <line x1="195" y1="115" x2="345" y2="135" stroke="#16213a" stroke-width="1"/>
  <line x1="195" y1="115" x2="345" y2="175" stroke="#16213a" stroke-width="1"/>
  <line x1="195" y1="155" x2="345" y2="55"  stroke="#16213a" stroke-width="1"/>
  <line x1="195" y1="155" x2="345" y2="95"  stroke="#16213a" stroke-width="1"/>
  <line x1="195" y1="155" x2="345" y2="135" stroke="#16213a" stroke-width="1"/>
  <line x1="195" y1="155" x2="345" y2="175" stroke="#16213a" stroke-width="1"/>

  <!-- Hidden1(4) → Hidden2(4) : 16 lines -->
  <line x1="345" y1="55"  x2="510" y2="55"  stroke="#16213a" stroke-width="1"/>
  <line x1="345" y1="55"  x2="510" y2="95"  stroke="#16213a" stroke-width="1"/>
  <line x1="345" y1="55"  x2="510" y2="135" stroke="#16213a" stroke-width="1"/>
  <line x1="345" y1="55"  x2="510" y2="175" stroke="#16213a" stroke-width="1"/>
  <line x1="345" y1="95"  x2="510" y2="55"  stroke="#16213a" stroke-width="1"/>
  <line x1="345" y1="95"  x2="510" y2="95"  stroke="#16213a" stroke-width="1"/>
  <line x1="345" y1="95"  x2="510" y2="135" stroke="#16213a" stroke-width="1"/>
  <line x1="345" y1="95"  x2="510" y2="175" stroke="#16213a" stroke-width="1"/>
  <line x1="345" y1="135" x2="510" y2="55"  stroke="#16213a" stroke-width="1"/>
  <line x1="345" y1="135" x2="510" y2="95"  stroke="#16213a" stroke-width="1"/>
  <line x1="345" y1="135" x2="510" y2="135" stroke="#16213a" stroke-width="1"/>
  <line x1="345" y1="135" x2="510" y2="175" stroke="#16213a" stroke-width="1"/>
  <line x1="345" y1="175" x2="510" y2="55"  stroke="#16213a" stroke-width="1"/>
  <line x1="345" y1="175" x2="510" y2="95"  stroke="#16213a" stroke-width="1"/>
  <line x1="345" y1="175" x2="510" y2="135" stroke="#16213a" stroke-width="1"/>
  <line x1="345" y1="175" x2="510" y2="175" stroke="#16213a" stroke-width="1"/>

  <!-- Hidden2(4) → Output(2) : 8 lines -->
  <line x1="510" y1="55"  x2="660" y2="96"  stroke="#16213a" stroke-width="1"/>
  <line x1="510" y1="55"  x2="660" y2="144" stroke="#16213a" stroke-width="1"/>
  <line x1="510" y1="95"  x2="660" y2="96"  stroke="#16213a" stroke-width="1"/>
  <line x1="510" y1="95"  x2="660" y2="144" stroke="#16213a" stroke-width="1"/>
  <line x1="510" y1="135" x2="660" y2="96"  stroke="#16213a" stroke-width="1"/>
  <line x1="510" y1="135" x2="660" y2="144" stroke="#16213a" stroke-width="1"/>
  <line x1="510" y1="175" x2="660" y2="96"  stroke="#16213a" stroke-width="1"/>
  <line x1="510" y1="175" x2="660" y2="144" stroke="#16213a" stroke-width="1"/>

  <!-- ════ NODES ════ -->

  <!-- Input nodes — blue #60a5fa -->
  <circle cx="195" cy="75"  r="12" fill="#60a5fa" fill-opacity="0.12" filter="url(#ng)">
    <animate attributeName="fill-opacity" values="0.08;0.28;0.08" dur="2.1s" begin="0.0s" repeatCount="indefinite"/>
  </circle>
  <circle cx="195" cy="75"  r="6" fill="#60a5fa" fill-opacity="0.9"/>

  <circle cx="195" cy="115" r="12" fill="#60a5fa" fill-opacity="0.12" filter="url(#ng)">
    <animate attributeName="fill-opacity" values="0.08;0.28;0.08" dur="1.8s" begin="0.7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="195" cy="115" r="6" fill="#60a5fa" fill-opacity="0.9"/>

  <circle cx="195" cy="155" r="12" fill="#60a5fa" fill-opacity="0.12" filter="url(#ng)">
    <animate attributeName="fill-opacity" values="0.08;0.28;0.08" dur="2.4s" begin="1.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="195" cy="155" r="6" fill="#60a5fa" fill-opacity="0.9"/>

  <!-- Hidden1 nodes — purple #a78bfa -->
  <circle cx="345" cy="55"  r="11" fill="#a78bfa" fill-opacity="0.10" filter="url(#ng)">
    <animate attributeName="fill-opacity" values="0.06;0.24;0.06" dur="1.6s" begin="0.3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="345" cy="55"  r="5.5" fill="#a78bfa" fill-opacity="0.85"/>

  <circle cx="345" cy="95"  r="11" fill="#a78bfa" fill-opacity="0.10" filter="url(#ng)">
    <animate attributeName="fill-opacity" values="0.06;0.24;0.06" dur="2.0s" begin="1.0s" repeatCount="indefinite"/>
  </circle>
  <circle cx="345" cy="95"  r="5.5" fill="#a78bfa" fill-opacity="0.85"/>

  <circle cx="345" cy="135" r="11" fill="#a78bfa" fill-opacity="0.10" filter="url(#ng)">
    <animate attributeName="fill-opacity" values="0.06;0.24;0.06" dur="1.9s" begin="0.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="345" cy="135" r="5.5" fill="#a78bfa" fill-opacity="0.85"/>

  <circle cx="345" cy="175" r="11" fill="#a78bfa" fill-opacity="0.10" filter="url(#ng)">
    <animate attributeName="fill-opacity" values="0.06;0.24;0.06" dur="2.3s" begin="1.7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="345" cy="175" r="5.5" fill="#a78bfa" fill-opacity="0.85"/>

  <!-- Hidden2 nodes — purple (slightly lighter) -->
  <circle cx="510" cy="55"  r="11" fill="#c4b5fd" fill-opacity="0.10" filter="url(#ng)">
    <animate attributeName="fill-opacity" values="0.06;0.22;0.06" dur="1.7s" begin="0.9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="510" cy="55"  r="5.5" fill="#c4b5fd" fill-opacity="0.8"/>

  <circle cx="510" cy="95"  r="11" fill="#c4b5fd" fill-opacity="0.10" filter="url(#ng)">
    <animate attributeName="fill-opacity" values="0.06;0.22;0.06" dur="2.2s" begin="0.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="510" cy="95"  r="5.5" fill="#c4b5fd" fill-opacity="0.8"/>

  <circle cx="510" cy="135" r="11" fill="#c4b5fd" fill-opacity="0.10" filter="url(#ng)">
    <animate attributeName="fill-opacity" values="0.06;0.22;0.06" dur="1.8s" begin="1.3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="510" cy="135" r="5.5" fill="#c4b5fd" fill-opacity="0.8"/>

  <circle cx="510" cy="175" r="11" fill="#c4b5fd" fill-opacity="0.10" filter="url(#ng)">
    <animate attributeName="fill-opacity" values="0.06;0.22;0.06" dur="2.5s" begin="0.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="510" cy="175" r="5.5" fill="#c4b5fd" fill-opacity="0.8"/>

  <!-- Output nodes — cyan #22d3ee -->
  <circle cx="660" cy="96"  r="13" fill="#22d3ee" fill-opacity="0.10" filter="url(#ng)">
    <animate attributeName="fill-opacity" values="0.08;0.30;0.08" dur="1.5s" begin="0.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="660" cy="96"  r="6.5" fill="#22d3ee" fill-opacity="0.9"/>

  <circle cx="660" cy="144" r="13" fill="#22d3ee" fill-opacity="0.10" filter="url(#ng)">
    <animate attributeName="fill-opacity" values="0.08;0.30;0.08" dur="1.9s" begin="1.1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="660" cy="144" r="6.5" fill="#22d3ee" fill-opacity="0.9"/>

  <!-- ════ 6 SIGNAL PULSES traveling through the network ════ -->
  <!-- Each pulse: white spark with glow, fades in at start, fades out at end -->

  <!-- S1: I0→H1→J0→O0   begin=0.0s -->
  <circle r="3.5" fill="#ffffff" filter="url(#sg)">
    <animateMotion path="M195,75 L345,95 L510,55 L660,96" dur="3s" begin="0.0s" repeatCount="indefinite" calcMode="linear"/>
    <animate attributeName="opacity" values="0;0.9;0.9;0.9;0" keyTimes="0;0.06;0.5;0.94;1" dur="3s" begin="0.0s" repeatCount="indefinite"/>
  </circle>

  <!-- S2: I2→H2→J3→O1   begin=0.5s -->
  <circle r="3.5" fill="#ffffff" filter="url(#sg)">
    <animateMotion path="M195,155 L345,135 L510,175 L660,144" dur="3s" begin="0.5s" repeatCount="indefinite" calcMode="linear"/>
    <animate attributeName="opacity" values="0;0.9;0.9;0.9;0" keyTimes="0;0.06;0.5;0.94;1" dur="3s" begin="0.5s" repeatCount="indefinite"/>
  </circle>

  <!-- S3: I1→H3→J1→O0   begin=1.0s -->
  <circle r="3.5" fill="#ffffff" filter="url(#sg)">
    <animateMotion path="M195,115 L345,175 L510,95 L660,96" dur="3s" begin="1.0s" repeatCount="indefinite" calcMode="linear"/>
    <animate attributeName="opacity" values="0;0.9;0.9;0.9;0" keyTimes="0;0.06;0.5;0.94;1" dur="3s" begin="1.0s" repeatCount="indefinite"/>
  </circle>

  <!-- S4: I0→H0→J2→O1   begin=1.5s -->
  <circle r="3.5" fill="#ffffff" filter="url(#sg)">
    <animateMotion path="M195,75 L345,55 L510,135 L660,144" dur="3s" begin="1.5s" repeatCount="indefinite" calcMode="linear"/>
    <animate attributeName="opacity" values="0;0.9;0.9;0.9;0" keyTimes="0;0.06;0.5;0.94;1" dur="3s" begin="1.5s" repeatCount="indefinite"/>
  </circle>

  <!-- S5: I2→H0→J2→O0   begin=2.0s -->
  <circle r="3.5" fill="#ffffff" filter="url(#sg)">
    <animateMotion path="M195,155 L345,55 L510,135 L660,96" dur="3s" begin="2.0s" repeatCount="indefinite" calcMode="linear"/>
    <animate attributeName="opacity" values="0;0.9;0.9;0.9;0" keyTimes="0;0.06;0.5;0.94;1" dur="3s" begin="2.0s" repeatCount="indefinite"/>
  </circle>

  <!-- S6: I1→H2→J1→O1   begin=2.5s -->
  <circle r="3.5" fill="#ffffff" filter="url(#sg)">
    <animateMotion path="M195,115 L345,135 L510,95 L660,144" dur="3s" begin="2.5s" repeatCount="indefinite" calcMode="linear"/>
    <animate attributeName="opacity" values="0;0.9;0.9;0.9;0" keyTimes="0;0.06;0.5;0.94;1" dur="3s" begin="2.5s" repeatCount="indefinite"/>
  </circle>

  <!-- ════ LAYER LABELS ════ -->
  <text x="195" y="210" font-family="'Courier New',Courier,monospace" font-size="9" fill="#60a5fa" fill-opacity="0.6" text-anchor="middle" letter-spacing="2">INPUT</text>
  <text x="345" y="210" font-family="'Courier New',Courier,monospace" font-size="9" fill="#a78bfa" fill-opacity="0.6" text-anchor="middle" letter-spacing="2">HIDDEN</text>
  <text x="510" y="210" font-family="'Courier New',Courier,monospace" font-size="9" fill="#a78bfa" fill-opacity="0.6" text-anchor="middle" letter-spacing="2">HIDDEN</text>
  <text x="660" y="210" font-family="'Courier New',Courier,monospace" font-size="9" fill="#22d3ee" fill-opacity="0.6" text-anchor="middle" letter-spacing="2">OUTPUT</text>

  <!-- Vertical layer dividers (very subtle) -->
  <line x1="265" y1="40" x2="265" y2="190" stroke="#1e2640" stroke-width="1" stroke-dasharray="3 6"/>
  <line x1="427" y1="40" x2="427" y2="190" stroke="#1e2640" stroke-width="1" stroke-dasharray="3 6"/>
  <line x1="583" y1="40" x2="583" y2="190" stroke="#1e2640" stroke-width="1" stroke-dasharray="3 6"/>

  <!-- Caption -->
  <text x="430" y="224" font-family="'Courier New',Courier,monospace" font-size="8" fill="#2d3748" text-anchor="middle" letter-spacing="3">FEED-FORWARD NEURAL NETWORK  ·  FORWARD PROPAGATION</text>
</svg>
