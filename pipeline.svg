<svg xmlns="http://www.w3.org/2000/svg" width="900" height="140" viewBox="0 0 900 140">
  <defs>
    <filter id="hg" x="-40%" y="-100%" width="180%" height="300%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="ag" x="-60%" y="-200%" width="220%" height="500%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#60A5FA" stop-opacity="0.1"/>
      <stop offset="30%"  stop-color="#A78BFA" stop-opacity="0.9"/>
      <stop offset="70%"  stop-color="#60A5FA" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="140" rx="8" fill="#080d14"/>
  <rect x="0.75" y="0.75" width="898.5" height="138.5" rx="7.5" fill="none" stroke="#1a2438" stroke-width="1.5"/>

  <!-- Section label -->
  <text x="450" y="20" text-anchor="middle" font-family="'Courier New',monospace" font-size="8.5" fill="#2d3a52" letter-spacing="5">AI  PRODUCT  PIPELINE</text>

  <!-- Connecting baseline -->
  <line x1="90" y1="80" x2="810" y2="80" stroke="#1a2438" stroke-width="1.5"/>

  <!-- Animated flow pulse -->
  <line x1="90" y1="80" x2="810" y2="80" stroke="url(#flow)" stroke-width="2"
        stroke-dasharray="160 560" stroke-linecap="round">
    <animate attributeName="stroke-dashoffset" from="720" to="-720" dur="3.5s" repeatCount="indefinite"/>
  </line>

  <!-- Connector lines between hexagons -->
  <line x1="119.5" y1="80" x2="204.5" y2="80" stroke="#1e2d45" stroke-width="1.2"/>
  <line x1="263.5" y1="80" x2="348.5" y2="80" stroke="#1e2d45" stroke-width="1.2"/>
  <line x1="407.5" y1="80" x2="492.5" y2="80" stroke="#1e2d45" stroke-width="1.2"/>
  <line x1="551.5" y1="80" x2="636.5" y2="80" stroke="#1e2d45" stroke-width="1.2"/>
  <line x1="695.5" y1="80" x2="780.5" y2="80" stroke="#1e2d45" stroke-width="1.2"/>

  <!-- Arrow chevrons between nodes -->
  <text x="162" y="84" text-anchor="middle" font-family="monospace" font-size="10" fill="#2d3a52">›</text>
  <text x="306" y="84" text-anchor="middle" font-family="monospace" font-size="10" fill="#2d3a52">›</text>
  <text x="450" y="84" text-anchor="middle" font-family="monospace" font-size="10" fill="#2d3a52">›</text>
  <text x="594" y="84" text-anchor="middle" font-family="monospace" font-size="10" fill="#2d3a52">›</text>
  <text x="738" y="84" text-anchor="middle" font-family="monospace" font-size="10" fill="#2d3a52">›</text>

  <!-- NODE 1: DATA — blue #60A5FA — pointy-top hex cx=90 cy=80 r=34 -->
  <polygon points="90,46 119.4,63 119.4,97 90,114 60.6,97 60.6,63"
           fill="#070e1a" stroke="#60A5FA" stroke-width="1.3" stroke-opacity="0.7" filter="url(#hg)"/>
  <text x="90" y="77" text-anchor="middle" font-family="'Courier New',monospace" font-size="9" font-weight="bold" fill="#60A5FA" letter-spacing="1">DATA</text>
  <text x="90" y="91" text-anchor="middle" font-family="'Courier New',monospace" font-size="7" fill="#3d5070">Ingest</text>

  <!-- NODE 2: FEAT. — purple #A78BFA -->
  <polygon points="234,46 263.4,63 263.4,97 234,114 204.6,97 204.6,63"
           fill="#070e1a" stroke="#A78BFA" stroke-width="1.3" stroke-opacity="0.7" filter="url(#hg)"/>
  <text x="234" y="77" text-anchor="middle" font-family="'Courier New',monospace" font-size="8.5" font-weight="bold" fill="#A78BFA" letter-spacing="0.5">FEAT.</text>
  <text x="234" y="91" text-anchor="middle" font-family="'Courier New',monospace" font-size="7" fill="#3d5070">Extract</text>

  <!-- NODE 3: MODEL — indigo #818CF8 -->
  <polygon points="378,46 407.4,63 407.4,97 378,114 348.6,97 348.6,63"
           fill="#070e1a" stroke="#818CF8" stroke-width="1.3" stroke-opacity="0.7" filter="url(#hg)"/>
  <text x="378" y="77" text-anchor="middle" font-family="'Courier New',monospace" font-size="8" font-weight="bold" fill="#818CF8" letter-spacing="0.5">MODEL</text>
  <text x="378" y="91" text-anchor="middle" font-family="'Courier New',monospace" font-size="7" fill="#3d5070">Train</text>

  <!-- NODE 4: APIS — pink #F472B6 -->
  <polygon points="522,46 551.4,63 551.4,97 522,114 492.6,97 492.6,63"
           fill="#070e1a" stroke="#F472B6" stroke-width="1.3" stroke-opacity="0.7" filter="url(#hg)"/>
  <text x="522" y="77" text-anchor="middle" font-family="'Courier New',monospace" font-size="9" font-weight="bold" fill="#F472B6" letter-spacing="1">APIS</text>
  <text x="522" y="91" text-anchor="middle" font-family="'Courier New',monospace" font-size="7" fill="#3d5070">Serve</text>

  <!-- NODE 5: CLOUD — emerald #34D399 -->
  <polygon points="666,46 695.4,63 695.4,97 666,114 636.6,97 636.6,63"
           fill="#070e1a" stroke="#34D399" stroke-width="1.3" stroke-opacity="0.7" filter="url(#hg)"/>
  <text x="666" y="77" text-anchor="middle" font-family="'Courier New',monospace" font-size="8" font-weight="bold" fill="#34D399" letter-spacing="0.5">CLOUD</text>
  <text x="666" y="91" text-anchor="middle" font-family="'Courier New',monospace" font-size="7" fill="#3d5070">Deploy</text>

  <!-- NODE 6: PROD. — amber #FBBF24 -->
  <polygon points="810,46 839.4,63 839.4,97 810,114 780.6,97 780.6,63"
           fill="#070e1a" stroke="#FBBF24" stroke-width="1.3" stroke-opacity="0.7" filter="url(#hg)"/>
  <text x="810" y="77" text-anchor="middle" font-family="'Courier New',monospace" font-size="8" font-weight="bold" fill="#FBBF24" letter-spacing="0.5">PROD.</text>
  <text x="810" y="91" text-anchor="middle" font-family="'Courier New',monospace" font-size="7" fill="#3d5070">Ship</text>

  <!-- Traveling dot along baseline -->
  <circle cy="80" r="4.5" fill="#60A5FA" filter="url(#ag)" opacity="0">
    <animate attributeName="cx"
             values="90;234;378;522;666;810;810"
             keyTimes="0;0.16;0.33;0.5;0.66;0.83;1"
             dur="3.5s" repeatCount="indefinite"
             calcMode="spline"
             keySplines="0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0;0"/>
    <animate attributeName="opacity"
             values="0;0.95;0.95;0.95;0.95;0.95;0"
             keyTimes="0;0.06;0.3;0.5;0.7;0.86;1"
             dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="fill"
             values="#60A5FA;#60A5FA;#A78BFA;#818CF8;#F472B6;#34D399;#FBBF24"
             keyTimes="0;0.16;0.33;0.5;0.66;0.83;1"
             dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="r"
             values="4.5;5.5;4.5;5.5;4.5;5.5;4.5"
             keyTimes="0;0.16;0.33;0.5;0.66;0.83;1"
             dur="3.5s" repeatCount="indefinite"/>
  </circle>
</svg>
