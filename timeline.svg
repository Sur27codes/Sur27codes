<svg xmlns="http://www.w3.org/2000/svg" width="900" height="390" viewBox="0 0 900 390">
  <defs>
    <filter id="dg" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="pg" x="-300%" y="-300%" width="700%" height="700%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="tg" x="-8%" y="-60%" width="116%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="spineG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#60A5FA" stop-opacity="0.8"/>
      <stop offset="50%"  stop-color="#A78BFA" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="390" rx="10" fill="#080d14"/>
  <rect x="0.75" y="0.75" width="898.5" height="388.5" rx="9.5" fill="none" stroke="#1a2438" stroke-width="1.5"/>

  <!-- Title -->
  <text x="450" y="34" text-anchor="middle" font-family="'Courier New',monospace" font-size="13"
        font-weight="bold" fill="#A78BFA" letter-spacing="6" filter="url(#tg)">TIMELINE</text>
  <line x1="60" y1="44" x2="840" y2="44" stroke="#1a2438" stroke-width="1"/>

  <!-- ── VERTICAL SPINE ── -->
  <line x1="148" y1="68" x2="148" y2="365" stroke="#1a2438" stroke-width="2"/>
  <!-- Animated draw line -->
  <line x1="148" y1="68" x2="148" y2="365" stroke="url(#spineG)" stroke-width="2"
        stroke-dasharray="297 297">
    <animate attributeName="stroke-dashoffset" values="297;0;0;297" keyTimes="0;0.38;0.85;1" dur="7s" repeatCount="indefinite"/>
  </line>
  <!-- Traveling dot -->
  <circle cx="148" r="5" fill="#60A5FA" filter="url(#pg)" opacity="0">
    <animate attributeName="cy"      values="68;365;365"  keyTimes="0;0.38;1" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;0.9;0"   keyTimes="0;0.34;0.38" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="r"       values="5;3;3"       keyTimes="0;0.38;1" dur="7s" repeatCount="indefinite"/>
  </circle>

  <!-- ── ENTRY 1: BTech CSE ── y=92 (education → amber) -->
  <circle cx="148" cy="92" r="7.5" fill="#FBBF24" filter="url(#dg)">
    <animate attributeName="r"       values="6;9;6"       dur="3.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;1;0.9"   dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="148" cy="92" r="3.5" fill="#FBBF24"/>
  <line x1="157" y1="92" x2="184" y2="92" stroke="#1a2438" stroke-width="1.5"/>
  <text x="190" y="87" font-family="'Courier New',monospace" font-size="13" font-weight="bold" fill="#FBBF24">BTech Computer Science Engineering</text>
  <text x="190" y="104" font-family="'Courier New',monospace" font-size="10" fill="#4A5568">Indus University, India  ·  2021 – May 2025  ·  GPA 3.4 / 4.0</text>

  <!-- ── ENTRY 2: Web Dev Intern ── y=161 (blue) -->
  <circle cx="148" cy="161" r="7" fill="#60A5FA" filter="url(#dg)">
    <animate attributeName="r"       values="5.5;8.5;5.5" dur="3.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.85;1;0.85" dur="3.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="148" cy="161" r="3" fill="#60A5FA"/>
  <line x1="157" y1="161" x2="184" y2="161" stroke="#1a2438" stroke-width="1.5"/>
  <text x="190" y="156" font-family="'Courier New',monospace" font-size="13" font-weight="bold" fill="#60A5FA">Web Dev Intern  ·  Shaligram Infotech</text>
  <text x="190" y="172" font-family="'Courier New',monospace" font-size="10" fill="#4A5568">Jun 2023 – Jul 2023  ·  Load efficiency ↑48%  ·  Client satisfaction ↑45%</text>

  <!-- ── ENTRY 3: Python ML Intern ── y=230 (blue) -->
  <circle cx="148" cy="230" r="7" fill="#60A5FA" filter="url(#dg)">
    <animate attributeName="r"       values="5.5;8.5;5.5" dur="4.1s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.85;1;0.85" dur="4.1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="148" cy="230" r="3" fill="#60A5FA"/>
  <line x1="157" y1="230" x2="184" y2="230" stroke="#1a2438" stroke-width="1.5"/>
  <text x="190" y="225" font-family="'Courier New',monospace" font-size="13" font-weight="bold" fill="#60A5FA">Python ML Intern  ·  Tech Micra</text>
  <text x="190" y="242" font-family="'Courier New',monospace" font-size="10" fill="#4A5568">Jun 2024 – Jul 2024  ·  Interpretability ↑42%  ·  Overfitting ↓35%</text>

  <!-- ── ENTRY 4: Adani AI Intern ── y=299 (purple) -->
  <circle cx="148" cy="299" r="7.5" fill="#A78BFA" filter="url(#dg)">
    <animate attributeName="r"       values="6;9.5;6"     dur="2.9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.85;1;0.85" dur="2.9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="148" cy="299" r="3.5" fill="#A78BFA"/>
  <line x1="157" y1="299" x2="184" y2="299" stroke="#1a2438" stroke-width="1.5"/>
  <text x="190" y="294" font-family="'Courier New',monospace" font-size="13" font-weight="bold" fill="#A78BFA">Data Science &amp; AI Intern  ·  Adani Enterprise Ltd.</text>
  <text x="190" y="311" font-family="'Courier New',monospace" font-size="10" fill="#4A5568">Jan 2025 – Jul 2025  ·  78% accuracy  ·  Analysis time ↓34%  ·  Deploy ↓44%</text>

  <!-- ── ENTRY 5: MS Stony Brook ── y=365 (amber) -->
  <circle cx="148" cy="365" r="7.5" fill="#FBBF24" filter="url(#dg)">
    <animate attributeName="r"       values="6;9.5;6"     dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;1;0.9"   dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="148" cy="365" r="3.5" fill="#FBBF24"/>
  <line x1="157" y1="365" x2="184" y2="365" stroke="#1a2438" stroke-width="1.5"/>
  <text x="190" y="360" font-family="'Courier New',monospace" font-size="13" font-weight="bold" fill="#FBBF24">MS Data Science  ·  Stony Brook University</text>
  <text x="190" y="377" font-family="'Courier New',monospace" font-size="10" fill="#4A5568">2025 – May 2027  ·  ML  ·  Statistical Computing  ·  Data Management</text>

  <!-- Legend -->
  <circle cx="640" cy="382" r="4.5" fill="#FBBF24" opacity="0.8"/>
  <text x="650" y="387" font-family="'Courier New',monospace" font-size="9" fill="#4A5568">Education</text>
  <circle cx="726" cy="382" r="4.5" fill="#60A5FA" opacity="0.8"/>
  <text x="736" y="387" font-family="'Courier New',monospace" font-size="9" fill="#4A5568">Internship</text>
  <circle cx="814" cy="382" r="4.5" fill="#A78BFA" opacity="0.8"/>
  <text x="824" y="387" font-family="'Courier New',monospace" font-size="9" fill="#4A5568">AI/ML</text>
</svg>
