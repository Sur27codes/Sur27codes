<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080816"/>
      <stop offset="30%" stop-color="#0d1130"/>
      <stop offset="60%" stop-color="#130a30"/>
      <stop offset="100%" stop-color="#080816"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7B9EFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#7B9EFF" stop-opacity="1"/>
      <stop offset="100%" stop-color="#7B9EFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="textglow">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="220" fill="url(#bg)"/>

  <!-- Subtle grid -->
  <g stroke="#7B9EFF" stroke-width="0.4" opacity="0.07">
    <line x1="0" y1="55" x2="900" y2="55"/>
    <line x1="0" y1="110" x2="900" y2="110"/>
    <line x1="0" y1="165" x2="900" y2="165"/>
    <line x1="112" y1="0" x2="112" y2="220"/>
    <line x1="225" y1="0" x2="225" y2="220"/>
    <line x1="337" y1="0" x2="337" y2="220"/>
    <line x1="450" y1="0" x2="450" y2="220"/>
    <line x1="562" y1="0" x2="562" y2="220"/>
    <line x1="675" y1="0" x2="675" y2="220"/>
    <line x1="787" y1="0" x2="787" y2="220"/>
  </g>

  <!-- Central glow orb -->
  <ellipse cx="450" cy="110" rx="300" ry="90" fill="#7B9EFF" opacity="0.025">
    <animate attributeName="rx" values="300;360;300" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.025;0.05;0.025" dur="5s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Animated dot particles — blue -->
  <circle cx="55"  cy="42"  r="2.2" fill="#7B9EFF" filter="url(#glow)">
    <animate attributeName="cy"      values="42;22;42"    dur="3.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;0.2;0.9" dur="3.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="845" cy="178" r="2.5" fill="#7B9EFF" filter="url(#glow)">
    <animate attributeName="cy"      values="178;158;178" dur="4.3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0.1;0.7" dur="4.3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="190" cy="185" r="1.8" fill="#7B9EFF">
    <animate attributeName="cy"      values="185;168;185" dur="5.1s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.1;0.5" dur="5.1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="730" cy="28"  r="2.0" fill="#7B9EFF" filter="url(#glow)">
    <animate attributeName="cy"      values="28;48;28"    dur="3.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0.2;0.8" dur="3.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="380" cy="195" r="1.5" fill="#7B9EFF">
    <animate attributeName="cy"      values="195;180;195" dur="6.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0.1;0.4" dur="6.2s" repeatCount="indefinite"/>
  </circle>

  <!-- Cyan particles -->
  <circle cx="330" cy="18"  r="1.8" fill="#36BCF7" filter="url(#glow)">
    <animate attributeName="cy"      values="18;38;18"    dur="6s"   repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0.15;0.7" dur="6s"  repeatCount="indefinite"/>
  </circle>
  <circle cx="870" cy="75"  r="2.0" fill="#36BCF7">
    <animate attributeName="cy"      values="75;55;75"    dur="4.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.1;0.5" dur="4.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="640" cy="200" r="1.5" fill="#36BCF7">
    <animate attributeName="cy"      values="200;185;200" dur="5.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0.1;0.4" dur="5.8s" repeatCount="indefinite"/>
  </circle>

  <!-- Pink/red accent particles -->
  <circle cx="115" cy="140" r="1.8" fill="#FF6B6B" filter="url(#glow)">
    <animate attributeName="cy"      values="140;122;140" dur="4.1s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0.1;0.6" dur="4.1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="790" cy="190" r="2.0" fill="#FF6B6B">
    <animate attributeName="cy"      values="190;170;190" dur="5.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0.1;0.4" dur="5.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="510" cy="15"  r="1.5" fill="#FF6B6B">
    <animate attributeName="cy"      values="15;35;15"    dur="7s"   repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.1;0.5" dur="7s"   repeatCount="indefinite"/>
  </circle>

  <!-- Corner code decorations -->
  <text x="14" y="32" font-family="monospace" font-size="20" fill="#7B9EFF" opacity="0.35">&lt;</text>
  <text x="871" y="213" font-family="monospace" font-size="20" fill="#7B9EFF" opacity="0.35">/&gt;</text>

  <!-- Blinking cursor element -->
  <rect x="858" y="18" width="14" height="2.5" fill="#7B9EFF" rx="1">
    <animate attributeName="opacity" values="0.6;0;0.6" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <!-- Small diamond accents -->
  <polygon points="30,110 34,106 38,110 34,114" fill="#7B9EFF" opacity="0.3">
    <animate attributeName="opacity" values="0.3;0.7;0.3" dur="3s" repeatCount="indefinite"/>
  </polygon>
  <polygon points="862,110 866,106 870,110 866,114" fill="#36BCF7" opacity="0.3">
    <animate attributeName="opacity" values="0.3;0.7;0.3" dur="3.5s" repeatCount="indefinite"/>
  </polygon>

  <!-- Main title with glow -->
  <text x="450" y="105"
        text-anchor="middle"
        font-family="'Courier New', Courier, monospace"
        font-size="52"
        font-weight="bold"
        fill="#ffffff"
        filter="url(#textglow)"
        letter-spacing="9">SUR VAGHASIYA</text>

  <!-- Animated expanding underline under name -->
  <line x1="450" y1="115" x2="450" y2="115" stroke="url(#lineGrad)" stroke-width="1.5">
    <animate attributeName="x1" values="450;160;450" dur="2.8s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
    <animate attributeName="x2" values="450;740;450" dur="2.8s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
  </line>

  <!-- Subtitle -->
  <text x="450" y="155"
        text-anchor="middle"
        font-family="'Courier New', Courier, monospace"
        font-size="13.5"
        fill="#8899cc"
        letter-spacing="3.5">AI ENGINEER  ·  ML SYSTEMS  ·  FULL-STACK  ·  DATA SCIENTIST</text>

  <!-- Bottom pulsing line -->
  <line x1="0" y1="218" x2="900" y2="218" stroke="url(#lineGrad)" stroke-width="2">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/>
  </line>

  <!-- Glowing dots on bottom line -->
  <circle cx="225" cy="218" r="3.5" fill="#7B9EFF" filter="url(#glow)">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="450" cy="218" r="4.5" fill="#7B9EFF" filter="url(#glow)">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="675" cy="218" r="3.5" fill="#7B9EFF" filter="url(#glow)">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
  </circle>
</svg>
