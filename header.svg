<svg xmlns="http://www.w3.org/2000/svg" width="900" height="250" viewBox="0 0 900 250">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#020210"/>
      <stop offset="35%"  stop-color="#070b28"/>
      <stop offset="65%"  stop-color="#0d0620"/>
      <stop offset="100%" stop-color="#020210"/>
    </linearGradient>
    <radialGradient id="cGlow" cx="50%" cy="48%" r="45%">
      <stop offset="0%"   stop-color="#7B9EFF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#7B9EFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lineG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#7B9EFF" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#7B9EFF" stop-opacity="1"/>
      <stop offset="100%" stop-color="#7B9EFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="bigGlow" x="-30%" y="-80%" width="160%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="b1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="25" result="b2"/>
      <feMerge><feMergeNode in="b2"/><feMergeNode in="b1"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="pGlow" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- BACKGROUND -->
  <rect width="900" height="250" fill="url(#bg)"/>

  <!-- DOT GRID -->
  <g fill="#7B9EFF" opacity="0.11">
    <circle cx="100" cy="50"  r="1.2"/><circle cx="200" cy="50"  r="1.2"/><circle cx="300" cy="50"  r="1.2"/>
    <circle cx="400" cy="50"  r="1.2"/><circle cx="500" cy="50"  r="1.2"/><circle cx="600" cy="50"  r="1.2"/>
    <circle cx="700" cy="50"  r="1.2"/><circle cx="800" cy="50"  r="1.2"/>
    <circle cx="100" cy="100" r="1.2"/><circle cx="200" cy="100" r="1.2"/><circle cx="300" cy="100" r="1.2"/>
    <circle cx="400" cy="100" r="1.2"/><circle cx="500" cy="100" r="1.2"/><circle cx="600" cy="100" r="1.2"/>
    <circle cx="700" cy="100" r="1.2"/><circle cx="800" cy="100" r="1.2"/>
    <circle cx="100" cy="150" r="1.2"/><circle cx="200" cy="150" r="1.2"/><circle cx="300" cy="150" r="1.2"/>
    <circle cx="400" cy="150" r="1.2"/><circle cx="500" cy="150" r="1.2"/><circle cx="600" cy="150" r="1.2"/>
    <circle cx="700" cy="150" r="1.2"/><circle cx="800" cy="150" r="1.2"/>
    <circle cx="100" cy="200" r="1.2"/><circle cx="200" cy="200" r="1.2"/><circle cx="300" cy="200" r="1.2"/>
    <circle cx="400" cy="200" r="1.2"/><circle cx="500" cy="200" r="1.2"/><circle cx="600" cy="200" r="1.2"/>
    <circle cx="700" cy="200" r="1.2"/><circle cx="800" cy="200" r="1.2"/>
    <circle cx="50"  cy="25"  r="1"/><circle cx="150" cy="25"  r="1"/><circle cx="250" cy="25"  r="1"/>
    <circle cx="350" cy="25"  r="1"/><circle cx="450" cy="25"  r="1"/><circle cx="550" cy="25"  r="1"/>
    <circle cx="650" cy="25"  r="1"/><circle cx="750" cy="25"  r="1"/><circle cx="850" cy="25"  r="1"/>
    <circle cx="50"  cy="75"  r="1"/><circle cx="150" cy="75"  r="1"/><circle cx="250" cy="75"  r="1"/>
    <circle cx="350" cy="75"  r="1"/><circle cx="450" cy="75"  r="1"/><circle cx="550" cy="75"  r="1"/>
    <circle cx="650" cy="75"  r="1"/><circle cx="750" cy="75"  r="1"/><circle cx="850" cy="75"  r="1"/>
    <circle cx="50"  cy="125" r="1"/><circle cx="150" cy="125" r="1"/><circle cx="250" cy="125" r="1"/>
    <circle cx="350" cy="125" r="1"/><circle cx="450" cy="125" r="1"/><circle cx="550" cy="125" r="1"/>
    <circle cx="650" cy="125" r="1"/><circle cx="750" cy="125" r="1"/><circle cx="850" cy="125" r="1"/>
    <circle cx="50"  cy="175" r="1"/><circle cx="150" cy="175" r="1"/><circle cx="250" cy="175" r="1"/>
    <circle cx="350" cy="175" r="1"/><circle cx="450" cy="175" r="1"/><circle cx="550" cy="175" r="1"/>
    <circle cx="650" cy="175" r="1"/><circle cx="750" cy="175" r="1"/><circle cx="850" cy="175" r="1"/>
    <circle cx="50"  cy="225" r="1"/><circle cx="150" cy="225" r="1"/><circle cx="250" cy="225" r="1"/>
    <circle cx="350" cy="225" r="1"/><circle cx="450" cy="225" r="1"/><circle cx="550" cy="225" r="1"/>
    <circle cx="650" cy="225" r="1"/><circle cx="750" cy="225" r="1"/><circle cx="850" cy="225" r="1"/>
  </g>

  <!-- SCAN LINE -->
  <rect x="0" y="0" width="900" height="8" fill="#7B9EFF" opacity="0">
    <animate attributeName="y"       values="-8;258;-8"               dur="4.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;0.13;0.13;0.13;0;0" dur="4.5s" repeatCount="indefinite"
             keyTimes="0;0.03;0.08;0.5;0.92;0.97;1"/>
  </rect>

  <!-- CENTER GLOW (pulsing) -->
  <ellipse cx="450" cy="118" rx="360" ry="110" fill="url(#cGlow)">
    <animate attributeName="rx"      values="360;430;360" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.55;1"   dur="6s" repeatCount="indefinite"/>
  </ellipse>

  <!-- TOP-LEFT HUD BRACKET -->
  <path d="M 18 88 L 18 18 L 88 18" stroke="#7B9EFF" stroke-width="1.8" fill="none">
    <animate attributeName="opacity" values="0.55;0.9;0.55" dur="3s" repeatCount="indefinite"/>
  </path>
  <circle cx="24" cy="24" r="4.5" fill="#00FF88" filter="url(#pGlow)">
    <animate attributeName="opacity" values="1;0.15;1" dur="1.7s" repeatCount="indefinite"/>
  </circle>
  <text x="34" y="29" font-family="monospace" font-size="9" fill="#00FF88" opacity="0.85">ONLINE</text>
  <text x="18" y="45" font-family="monospace" font-size="7.5" fill="#7B9EFF" opacity="0.45">SYS v2026.5</text>

  <!-- TOP-RIGHT HUD BRACKET -->
  <path d="M 882 88 L 882 18 L 812 18" stroke="#7B9EFF" stroke-width="1.8" fill="none">
    <animate attributeName="opacity" values="0.55;0.9;0.55" dur="3.8s" repeatCount="indefinite"/>
  </path>
  <circle cx="876" cy="24" r="4.5" fill="#36BCF7" filter="url(#pGlow)">
    <animate attributeName="opacity" values="1;0.2;1" dur="2.3s" repeatCount="indefinite"/>
  </circle>
  <text x="816" y="29" font-family="monospace" font-size="9" fill="#36BCF7" opacity="0.85">AI: READY</text>
  <text x="822" y="45" font-family="monospace" font-size="7.5" fill="#7B9EFF" opacity="0.45">MISSIONS: 5</text>

  <!-- BOTTOM-LEFT HUD -->
  <path d="M 18 162 L 18 232 L 88 232" stroke="#7B9EFF" stroke-width="1.2" fill="none" opacity="0.35"/>
  <!-- BOTTOM-RIGHT HUD -->
  <path d="M 882 162 L 882 232 L 812 232" stroke="#7B9EFF" stroke-width="1.2" fill="none" opacity="0.35"/>

  <!-- PARTICLES — BLUE -->
  <circle cx="155" cy="58"  r="2.8" fill="#7B9EFF" filter="url(#pGlow)">
    <animate attributeName="cy"      values="58;36;58"    dur="3.9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;0.2;0.9" dur="3.9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="745" cy="192" r="2.3" fill="#7B9EFF" filter="url(#pGlow)">
    <animate attributeName="cy"      values="192;170;192" dur="4.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0.1;0.7" dur="4.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="55"  cy="165" r="1.8" fill="#7B9EFF">
    <animate attributeName="cy"      values="165;148;165" dur="5.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.1;0.5" dur="5.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="855" cy="68"  r="2.2" fill="#7B9EFF" filter="url(#pGlow)">
    <animate attributeName="cy"      values="68;48;68"    dur="3.3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0.2;0.8" dur="3.3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="420" cy="228" r="1.5" fill="#7B9EFF">
    <animate attributeName="cx"      values="420;440;420" dur="8s"   repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.7;0.3" dur="4s"   repeatCount="indefinite"/>
  </circle>

  <!-- PARTICLES — CYAN -->
  <circle cx="300" cy="32"  r="2.2" fill="#36BCF7" filter="url(#pGlow)">
    <animate attributeName="cy"      values="32;52;32"    dur="6.1s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0.15;0.7" dur="6.1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="610" cy="218" r="2.0" fill="#36BCF7">
    <animate attributeName="cy"      values="218;200;218" dur="4.9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.1;0.5" dur="4.9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="875" cy="145" r="1.6" fill="#36BCF7">
    <animate attributeName="cy"      values="145;128;145" dur="5.3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0.1;0.4" dur="5.3s" repeatCount="indefinite"/>
  </circle>

  <!-- PARTICLES — PINK -->
  <circle cx="390" cy="220" r="2.0" fill="#FF6B6B" filter="url(#pGlow)">
    <animate attributeName="cy"      values="220;202;220" dur="4.3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0.1;0.6" dur="4.3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="168" cy="200" r="1.5" fill="#FF6B6B">
    <animate attributeName="cy"      values="200;184;200" dur="5.9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0.1;0.4" dur="5.9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="742" cy="33"  r="2.0" fill="#FF6B6B">
    <animate attributeName="cy"      values="33;52;33"    dur="7.1s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.1;0.5" dur="7.1s" repeatCount="indefinite"/>
  </circle>

  <!-- MAIN TITLE -->
  <text x="450" y="120"
        text-anchor="middle"
        font-family="'Courier New', Courier, monospace"
        font-size="56"
        font-weight="bold"
        fill="#ffffff"
        filter="url(#bigGlow)"
        letter-spacing="10">SUR VAGHASIYA</text>

  <!-- ANIMATED UNDERLINE -->
  <line x1="450" y1="132" x2="450" y2="132" stroke="url(#lineG)" stroke-width="2.2">
    <animate attributeName="x1" values="450;135;450" dur="3.2s" repeatCount="indefinite"
             calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
    <animate attributeName="x2" values="450;765;450" dur="3.2s" repeatCount="indefinite"
             calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
  </line>

  <!-- SUBTITLE -->
  <text x="450" y="162"
        text-anchor="middle"
        font-family="'Courier New', Courier, monospace"
        font-size="13.5"
        fill="#8899cc"
        letter-spacing="4">AI ENGINEER  ·  ML SYSTEMS  ·  FULL-STACK  ·  DATA SCIENTIST</text>

  <!-- BOTTOM STATUS BAR -->
  <rect x="0" y="226" width="900" height="24" fill="#7B9EFF" opacity="0.055"/>
  <line x1="0" y1="226" x2="900" y2="226" stroke="#7B9EFF" stroke-width="0.6" opacity="0.5"/>

  <circle cx="20" cy="238" r="3.5" fill="#00FF88" filter="url(#pGlow)">
    <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="29" y="243" font-family="monospace" font-size="9.5" fill="#00FF88" opacity="0.9">SYS: ONLINE</text>
  <text x="127" y="243" font-family="monospace" font-size="9.5" fill="#7B9EFF" opacity="0.5">│</text>
  <text x="137" y="243" font-family="monospace" font-size="9.5" fill="#36BCF7" opacity="0.9">AI_ENGINE: ACTIVE</text>
  <text x="295" y="243" font-family="monospace" font-size="9.5" fill="#7B9EFF" opacity="0.5">│</text>
  <text x="305" y="243" font-family="monospace" font-size="9.5" fill="#7B9EFF" opacity="0.9">DEPLOYED: 5 PROJECTS</text>
  <text x="490" y="243" font-family="monospace" font-size="9.5" fill="#7B9EFF" opacity="0.5">│</text>
  <text x="500" y="243" font-family="monospace" font-size="9.5" fill="#FF6B6B" opacity="0.9">HIRING: OPEN ✦</text>
  <rect x="640" y="229" width="7" height="12" fill="#7B9EFF" rx="1">
    <animate attributeName="opacity" values="0.8;0;0.8" dur="1s" repeatCount="indefinite"/>
  </rect>
  <text x="885" y="243" text-anchor="end" font-family="monospace" font-size="9" fill="#7B9EFF" opacity="0.4">Sur27codes ▸</text>
</svg>
