<svg xmlns="http://www.w3.org/2000/svg" width="860" height="48" viewBox="0 0 860 48">
  <defs>
    <clipPath id="c"><rect width="860" height="48" rx="8"/></clipPath>
  </defs>

  <rect width="860" height="48" rx="8" fill="#0d1117"/>
  <rect width="860" height="48" rx="8" fill="#A78BFA" fill-opacity="0.06"/>

  <rect clip-path="url(#c)" x="-180" y="0" width="180" height="48" fill="#A78BFA" fill-opacity="0.09">
    <animate attributeName="x" from="-180" to="860" dur="3s" repeatCount="indefinite" calcMode="ease-in-out" begin="0.4s"/>
  </rect>

  <rect x="1" y="1" width="858" height="46" rx="7" fill="none" stroke="#A78BFA" stroke-width="1.5">
    <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="2.8s" repeatCount="indefinite" begin="0.4s"/>
  </rect>

  <rect x="0" y="0" width="5" height="48" rx="3" fill="#A78BFA">
    <animate attributeName="fill-opacity" values="0.7;1;0.7" dur="2.8s" repeatCount="indefinite" begin="0.4s"/>
  </rect>
  <rect x="855" y="0" width="5" height="48" rx="3" fill="#A78BFA">
    <animate attributeName="fill-opacity" values="0.7;1;0.7" dur="2.8s" repeatCount="indefinite" begin="1.8s"/>
  </rect>

  <line x1="16" y1="24" x2="290" y2="24" stroke="#A78BFA" stroke-opacity="0.25" stroke-width="1" stroke-dasharray="4 6"/>
  <line x1="570" y1="24" x2="844" y2="24" stroke="#A78BFA" stroke-opacity="0.25" stroke-width="1" stroke-dasharray="4 6"/>

  <circle cy="24" r="3" fill="#A78BFA">
    <animate attributeName="cx" from="16" to="290" dur="2.2s" repeatCount="indefinite" begin="0.5s"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.85;1" dur="2.2s" repeatCount="indefinite" begin="0.5s"/>
  </circle>
  <circle cy="24" r="3" fill="#A78BFA">
    <animate attributeName="cx" from="844" to="570" dur="2.2s" repeatCount="indefinite" begin="1.6s"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.85;1" dur="2.2s" repeatCount="indefinite" begin="1.6s"/>
  </circle>

  <text x="430" y="25" font-family="'Courier New',Courier,monospace" font-size="13" font-weight="bold"
        fill="#A78BFA" fill-opacity="0.2" text-anchor="middle" dominant-baseline="central" letter-spacing="5">
    ⟨  ML · AI · LLMs  ⟩
  </text>
  <text x="430" y="25" font-family="'Courier New',Courier,monospace" font-size="13" font-weight="bold"
        text-anchor="middle" dominant-baseline="central" letter-spacing="5">
    <animate attributeName="fill" values="#A78BFA;#C4B5FD;#A78BFA" dur="2.8s" repeatCount="indefinite" begin="0.4s"/>
    <animate attributeName="fill-opacity" values="1;0.7;1" dur="2.8s" repeatCount="indefinite" begin="0.4s"/>
    ⟨  ML · AI · LLMs  ⟩
  </text>
</svg>
