name: 🎮 Rock Paper Scissors Bot

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  play:
    if: startsWith(github.event.issue.title, 'rps|')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Play RPS
        id: play
        run: |
          output=$(python3 .github/scripts/rps.py "${{ github.event.issue.title }}" "${{ github.event.issue.user.login }}")
          echo "output=$output" >> $GITHUB_OUTPUT

      - name: Commit scoreboard
        run: |
          git config user.email "action@github.com"
          git config user.name "RPS Bot 🤖"
          git add README.md rps_stats.json
          git diff --staged --quiet || git commit -m "🎮 RPS scoreboard update"
          git pull --rebase origin main
          git push

      - name: Comment and close issue
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const raw = `${{ steps.play.outputs.output }}`;
            const map = {};
            raw.split('|').forEach(p => { const [k,v] = p.split(':'); map[k]=v; });
            const emojis = { rock: '🪨', paper: '📄', scissors: '✂️' };
            const pe = emojis[map.PC] || map.PC;
            const be = emojis[map.BC] || map.BC;

            let header, line;
            if (map.RESULT === 'player') {
              header = '🎉 You Win!';
              line = `You played **${pe}** — I played **${be}**. Crushed it!`;
            } else if (map.RESULT === 'bot') {
              header = '🤖 Bot Wins!';
              line = `You played **${pe}** — I played **${be}**. I'm too good 😈`;
            } else {
              header = '🤝 Draw!';
              line = `We both played **${pe}**. Great minds think alike!`;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## ${header}\n\n${line}\n\n[🔥 Check the updated scoreboard →](https://github.com/Sur27codes/Sur27codes#-challenge-my-bot--rock-paper-scissors)`
            });

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed'
            });
