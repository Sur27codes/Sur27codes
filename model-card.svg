<svg xmlns="http://www.w3.org/2000/svg" width="860" height="440" viewBox="0 0 860 440">
  <defs>
    <clipPath id="mc"><rect width="860" height="440" rx="12"/></clipPath>
    <linearGradient id="barGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6d28d9"/>
      <stop offset="60%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#c4b5fd"/>
    </linearGradient>
    <linearGradient id="convBg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#052e16" stop-opacity="1"/>
      <stop offset="70%"  stop-color="#052e16" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#052e16" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="860" height="440" rx="12" fill="#0d1117"/>

  <!-- Scanline beam -->
  <rect clip-path="url(#mc)" x="-220" y="0" width="220" height="440" fill="#A78BFA" fill-opacity="0.04">
    <animate attributeName="x" from="-220" to="860" dur="4s" repeatCount="indefinite" calcMode="ease-in-out"/>
  </rect>

  <!-- Outer border pulse -->
  <rect x="1" y="1" width="858" height="438" rx="11" fill="none" stroke="#A78BFA" stroke-width="1.5">
    <animate attributeName="stroke-opacity" values="0.2;0.55;0.2" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- Left accent stripe -->
  <rect x="0" y="72" width="3" height="296" rx="1" fill="#A78BFA" fill-opacity="0.7"/>

  <!-- ═══════════ HEADER ═══════════ -->
  <text x="22" y="44" font-family="'Courier New',Courier,monospace" font-size="26" font-weight="bold" fill="#e6edf3" letter-spacing="-0.5">SurV-1.0</text>
  <text x="22" y="62" font-family="'Courier New',Courier,monospace" font-size="10" fill="#6e7681" letter-spacing="1.5">PERSONAL LANGUAGE MODEL  ·  AI/ML ENGINEER  ·  DATA SCIENTIST</text>

  <!-- DEPLOYED badge -->
  <rect x="694" y="14" width="148" height="36" rx="7" fill="#052e16"/>
  <rect x="694" y="14" width="148" height="36" rx="7" fill="none" stroke="#34D399" stroke-width="1.2">
    <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="1.6s" repeatCount="indefinite"/>
  </rect>
  <!-- pulsing dot -->
  <circle cx="714" cy="32" r="4" fill="#34D399">
    <animate attributeName="r"            values="3;5;3"     dur="1.6s" repeatCount="indefinite"/>
    <animate attributeName="fill-opacity" values="1;0.5;1"   dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <text x="727" y="32" font-family="'Courier New',Courier,monospace" font-size="12" font-weight="bold"
        fill="#34D399" dominant-baseline="central" letter-spacing="1">DEPLOYED ✓</text>

  <!-- Divider 1 -->
  <line x1="20" y1="74" x2="840" y2="74" stroke="#21262d" stroke-width="1"/>

  <!-- ═══════════ MODEL SPECS (2-col grid) ═══════════ -->
  <!-- Col 1 -->
  <text x="22" y="94"  font-family="'Courier New',Courier,monospace" font-size="9"  fill="#4d5562" letter-spacing="2">ARCHITECTURE</text>
  <text x="22" y="114" font-family="'Courier New',Courier,monospace" font-size="13" fill="#A78BFA">Transformer (Human Edition)</text>

  <text x="22" y="136" font-family="'Courier New',Courier,monospace" font-size="9"  fill="#4d5562" letter-spacing="2">TRAINING DATA</text>
  <text x="22" y="156" font-family="'Courier New',Courier,monospace" font-size="13" fill="#A78BFA">22 yrs · 10,000+ hrs of ML &amp; code</text>

  <!-- Col 2 -->
  <text x="448" y="94"  font-family="'Courier New',Courier,monospace" font-size="9"  fill="#4d5562" letter-spacing="2">CONTEXT WINDOW</text>
  <text x="448" y="114" font-family="'Courier New',Courier,monospace" font-size="13" fill="#A78BFA">Unbounded · open to any problem</text>

  <text x="448" y="136" font-family="'Courier New',Courier,monospace" font-size="9"  fill="#4d5562" letter-spacing="2">LICENSE</text>
  <text x="448" y="156" font-family="'Courier New',Courier,monospace" font-size="13" fill="#A78BFA">MIT · actively open to opportunities</text>

  <!-- Divider 2 -->
  <line x1="20" y1="170" x2="840" y2="170" stroke="#21262d" stroke-width="1"/>

  <!-- ═══════════ BENCHMARKS ═══════════ -->
  <text x="22" y="188" font-family="'Courier New',Courier,monospace" font-size="9" fill="#4d5562" letter-spacing="3">BENCHMARK  RESULTS</text>

  <!-- Bar 1 — ML Engineering 92% → 796 × 0.92 = 733 -->
  <text x="22"  y="208" font-family="'Courier New',Courier,monospace" font-size="11" fill="#c9d1d9">ML Engineering</text>
  <text x="838" y="208" font-family="'Courier New',Courier,monospace" font-size="11" fill="#A78BFA" text-anchor="end">92%</text>
  <rect x="22" y="213" width="796" height="8" rx="4" fill="#161b22"/>
  <rect x="22" y="213" width="0"   height="8" rx="4" fill="url(#barGrad)">
    <animate attributeName="width" from="0" to="733" dur="1.1s" begin="0.2s" fill="freeze" calcMode="ease-out"/>
  </rect>

  <!-- Bar 2 — LLMs &amp; GenAI 89% → 796 × 0.89 = 709 -->
  <text x="22"  y="238" font-family="'Courier New',Courier,monospace" font-size="11" fill="#c9d1d9">LLMs &amp; GenAI</text>
  <text x="838" y="238" font-family="'Courier New',Courier,monospace" font-size="11" fill="#A78BFA" text-anchor="end">89%</text>
  <rect x="22" y="243" width="796" height="8" rx="4" fill="#161b22"/>
  <rect x="22" y="243" width="0"   height="8" rx="4" fill="url(#barGrad)">
    <animate attributeName="width" from="0" to="709" dur="1.1s" begin="0.5s" fill="freeze" calcMode="ease-out"/>
  </rect>

  <!-- Bar 3 — Backend Systems 83% → 796 × 0.83 = 661 -->
  <text x="22"  y="268" font-family="'Courier New',Courier,monospace" font-size="11" fill="#c9d1d9">Backend Systems</text>
  <text x="838" y="268" font-family="'Courier New',Courier,monospace" font-size="11" fill="#A78BFA" text-anchor="end">83%</text>
  <rect x="22" y="273" width="796" height="8" rx="4" fill="#161b22"/>
  <rect x="22" y="273" width="0"   height="8" rx="4" fill="url(#barGrad)">
    <animate attributeName="width" from="0" to="661" dur="1.1s" begin="0.8s" fill="freeze" calcMode="ease-out"/>
  </rect>

  <!-- Bar 4 — Problem Solving 95% → 796 × 0.95 = 756 -->
  <text x="22"  y="298" font-family="'Courier New',Courier,monospace" font-size="11" fill="#c9d1d9">Problem Solving</text>
  <text x="838" y="298" font-family="'Courier New',Courier,monospace" font-size="11" fill="#A78BFA" text-anchor="end">95%</text>
  <rect x="22" y="303" width="796" height="8" rx="4" fill="#161b22"/>
  <rect x="22" y="303" width="0"   height="8" rx="4" fill="url(#barGrad)">
    <animate attributeName="width" from="0" to="756" dur="1.1s" begin="1.1s" fill="freeze" calcMode="ease-out"/>
  </rect>

  <!-- Divider 3 -->
  <line x1="20" y1="322" x2="840" y2="322" stroke="#21262d" stroke-width="1"/>

  <!-- ═══════════ TRAINING LOG ═══════════ -->
  <text x="22" y="340" font-family="'Courier New',Courier,monospace" font-size="9" fill="#4d5562" letter-spacing="3">TRAINING  LOG</text>

  <!-- Line 1 — [2021] fade in -->
  <text x="22" y="360" font-family="'Courier New',Courier,monospace" font-size="11" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.35s" begin="1.5s" fill="freeze"/>
    <tspan fill="#4d5562">[2021]</tspan>
    <tspan fill="#6e7681">  Initialized   ·  </tspan>
    <tspan fill="#34D399">BTech CSE @ Indus University</tspan>
    <tspan fill="#3a3f4b">   ···············  loss: 2.847</tspan>
  </text>

  <!-- Line 2 — [2023] -->
  <text x="22" y="380" font-family="'Courier New',Courier,monospace" font-size="11" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.35s" begin="1.9s" fill="freeze"/>
    <tspan fill="#4d5562">[2023]</tspan>
    <tspan fill="#6e7681">  Fine-tuned    ·  </tspan>
    <tspan fill="#60A5FA">Projects &amp; Research</tspan>
    <tspan fill="#3a3f4b">   ···················  loss: 0.923</tspan>
  </text>

  <!-- Line 3 — [2025] -->
  <text x="22" y="400" font-family="'Courier New',Courier,monospace" font-size="11" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.35s" begin="2.3s" fill="freeze"/>
    <tspan fill="#4d5562">[2025]</tspan>
    <tspan fill="#6e7681">  RLHF          ·  </tspan>
    <tspan fill="#F472B6">MS Data Science @ Stony Brook</tspan>
    <tspan fill="#3a3f4b">   ·············  loss: 0.124</tspan>
  </text>

  <!-- Converged row highlight -->
  <rect x="20" y="410" width="820" height="24" rx="4" fill="url(#convBg)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="2.7s" fill="freeze"/>
  </rect>

  <!-- Line 4 — [2026] Converged -->
  <text x="22" y="426" font-family="'Courier New',Courier,monospace" font-size="11" font-weight="bold" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="2.7s" fill="freeze"/>
    <tspan fill="#34D399">[2026]</tspan>
    <tspan fill="#a7f3d0">  Converged ✓  ·  </tspan>
    <tspan fill="#34D399">Seeking deployment</tspan>
    <tspan fill="#3a3f4b">   ·····················  loss: 0.012</tspan>
  </text>

  <!-- Blinking cursor — underline style -->
  <rect x="22" y="432" width="7" height="2" rx="1" fill="#A78BFA" opacity="0">
    <animate attributeName="opacity" values="0;0;1;0;1;0;1" keyTimes="0;0.68;0.72;0.78;0.84;0.90;1" dur="4s" repeatCount="indefinite" begin="3.2s"/>
  </rect>

</svg>
