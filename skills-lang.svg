<svg xmlns="http://www.w3.org/2000/svg" width="860" height="48" viewBox="0 0 860 48">
  <defs>
    <clipPath id="c"><rect width="860" height="48" rx="8"/></clipPath>
  </defs>

  <!-- solid dark background -->
  <rect width="860" height="48" rx="8" fill="#0d1117"/>

  <!-- colored inner glow layer -->
  <rect width="860" height="48" rx="8" fill="#60A5FA" fill-opacity="0.06"/>

  <!-- moving scanline beam -->
  <rect clip-path="url(#c)" x="-180" y="0" width="180" height="48" fill="#60A5FA" fill-opacity="0.09" rx="0">
    <animate attributeName="x" from="-180" to="860" dur="2.6s" repeatCount="indefinite" calcMode="ease-in-out"/>
  </rect>

  <!-- border -->
  <rect x="1" y="1" width="858" height="46" rx="7" fill="none" stroke="#60A5FA" stroke-width="1.5">
    <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="2.5s" repeatCount="indefinite"/>
  </rect>

  <!-- left accent -->
  <rect x="0" y="0" width="5" height="48" rx="3" fill="#60A5FA">
    <animate attributeName="fill-opacity" values="0.7;1;0.7" dur="2.5s" repeatCount="indefinite"/>
  </rect>
  <!-- right accent -->
  <rect x="855" y="0" width="5" height="48" rx="3" fill="#60A5FA">
    <animate attributeName="fill-opacity" values="0.7;1;0.7" dur="2.5s" repeatCount="indefinite" begin="1.25s"/>
  </rect>

  <!-- dashed side lines -->
  <line x1="16" y1="24" x2="280" y2="24" stroke="#60A5FA" stroke-opacity="0.25" stroke-width="1" stroke-dasharray="4 6"/>
  <line x1="580" y1="24" x2="844" y2="24" stroke="#60A5FA" stroke-opacity="0.25" stroke-width="1" stroke-dasharray="4 6"/>

  <!-- tracer dot left→right -->
  <circle cy="24" r="3" fill="#60A5FA">
    <animate attributeName="cx" from="16" to="280" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.85;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <!-- tracer dot right→left -->
  <circle cy="24" r="3" fill="#60A5FA">
    <animate attributeName="cx" from="844" to="580" dur="2s" repeatCount="indefinite" begin="1s"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.85;1" dur="2s" repeatCount="indefinite" begin="1s"/>
  </circle>

  <!-- dim ghost text -->
  <text x="430" y="25" font-family="'Courier New',Courier,monospace" font-size="13" font-weight="bold"
        fill="#60A5FA" fill-opacity="0.2" text-anchor="middle" dominant-baseline="central" letter-spacing="5">
    ⟨  LANGUAGES  ⟩
  </text>

  <!-- bright pulsing text -->
  <text x="430" y="25" font-family="'Courier New',Courier,monospace" font-size="13" font-weight="bold"
        text-anchor="middle" dominant-baseline="central" letter-spacing="5">
    <animate attributeName="fill" values="#60A5FA;#93C5FD;#60A5FA" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="fill-opacity" values="1;0.7;1" dur="2.5s" repeatCount="indefinite"/>
    ⟨  LANGUAGES  ⟩
  </text>
</svg>
