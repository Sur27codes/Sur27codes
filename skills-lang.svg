<svg xmlns="http://www.w3.org/2000/svg" width="420" height="36" viewBox="0 0 420 36">
  <defs>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0"/>
      <stop offset="20%" stop-color="#60A5FA" stop-opacity="0.8"/>
      <stop offset="80%" stop-color="#60A5FA" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#60A5FA" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- background pill -->
  <rect x="85" y="4" width="250" height="28" rx="14"
        fill="#60A5FA" fill-opacity="0.04" stroke="#60A5FA" stroke-opacity="0.15" stroke-width="1"/>

  <!-- outer glow ring pulse -->
  <rect x="79" y="-1" width="262" height="38" rx="17"
        fill="none" stroke="#60A5FA" stroke-width="1.5" filter="url(#glow)">
    <animate attributeName="stroke-opacity" values="0;0.6;0;0.4;0" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- left bracket -->
  <text x="88" y="23" font-family="monospace" font-size="13" fill="#60A5FA" fill-opacity="0.5">⟨</text>
  <!-- right bracket -->
  <text x="318" y="23" font-family="monospace" font-size="13" fill="#60A5FA" fill-opacity="0.5">⟩</text>

  <!-- label -->
  <text x="210" y="23" font-family="monospace" font-size="11" font-weight="bold"
        fill="#60A5FA" fill-opacity="0.3" text-anchor="middle" dominant-baseline="central" letter-spacing="2">LANGUAGES</text>
  <!-- bright animated label -->
  <text x="210" y="23" font-family="monospace" font-size="11" font-weight="bold"
        fill="#60A5FA" text-anchor="middle" dominant-baseline="central" letter-spacing="2" filter="url(#glow)">
    <animate attributeName="fill-opacity" values="0.9;0.4;0.9;1;0.5;0.9" dur="4s" repeatCount="indefinite"/>
    LANGUAGES
  </text>

  <!-- decorative side lines -->
  <line x1="0" y1="18" x2="80" y2="18" stroke="url(#line-grad)" stroke-width="1" opacity="0.4"/>
  <line x1="340" y1="18" x2="420" y2="18" stroke="url(#line-grad)" stroke-width="1" opacity="0.4"/>

  <!-- animated dots on lines -->
  <circle cx="0" cy="18" r="2" fill="#60A5FA">
    <animate attributeName="cx" from="0" to="78" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="420" cy="18" r="2" fill="#60A5FA">
    <animate attributeName="cx" from="420" to="342" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
